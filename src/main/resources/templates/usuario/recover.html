    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Recuperación de acceso | ITSON</title>
        <link rel="stylesheet" href="/styles/style.css">
    </head>
    <body>
        <nav>
            <a href="/login">
                <span class="logo">ITSON</span>
                <div>
                    <strong>ITSON</strong>
                    <small>Portal académico</small>
                </div>
            </a>

            <p>Recuperación de acceso</p>

            <span class="period">Ago–Dic 2026</span>
        </nav>

        <main class="recovery">
            <h1>Recuperación de acceso</h1>

            <section>
                <span class="badge">
                    <img src="/imgs/key.png" alt="">
                </span>

                <h2>Recupera tu acceso</h2>
                <p>Enviaremos un enlace válido por 20 minutos a tu correo institucional.</p>

                <form action="#" method="post">
                    <div>
                        <label for="email">Correo institucional</label>
                        <input type="email" id="email" name="email"
                            value="luis.torres.perez@potros.edu.mx" autocomplete="username" required>
                    </div>

                    <output>
                        <img src="/imgs/ok.png" alt="ok">
                        <p>
                            <strong>Enlace enviado</strong>
                            <span>Revisa tu bandeja y correo no deseado.</span>
                        </p>
                    </output>

                    <input type="submit" value="Reenviar enlace">
                </form>
            </section>
        </main>
    </body>
    </html>
